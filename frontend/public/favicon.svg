<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="waprivate">
  <!--
    A speech bubble with a keyhole in it: a conversation, held privately.
    Flat shapes and a single gradient — a favicon is seen at 16px far more
    often than anywhere else, and detail below that size turns to mud.

    The greens are WhatsApp's own (#25d366 into #128c7e), matching the app
    theme and the send button in the chat window, so a customer arriving
    from WhatsApp never crosses a colour change.
  -->
  <defs>
    <linearGradient id="waGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25d366"/>
      <stop offset="1" stop-color="#128c7e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#waGrad)"/>
  <path
    fill="#fff"
    d="M32 13c-10.5 0-19 7.4-19 16.6 0 5.3 2.9 10 7.3 13.1v8.6l7.9-4.5c1.2.2 2.5.3 3.8.3 10.5 0 19-7.4 19-16.5S42.5 13 32 13Z"
  />
  <path
    fill="#128c7e"
    d="M32 21.5a5.6 5.6 0 0 0-2.6 10.6l-1.3 6.3h7.8l-1.3-6.3A5.6 5.6 0 0 0 32 21.5Zm0 3.6a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"
  />
</svg>
